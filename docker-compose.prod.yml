name: songothon

services:
  consul:
    image: consul:1.14.5
    container_name: songothon_consul
    restart: always
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0 -data-dir=/consul/data
    ports:
      - "8800:8500"
    volumes:
      - songothon_consul:/consul/data:rw
    networks:
      - songothon_networks

  db:
    container_name: songothon_postgres
    image: postgres:15-alpine
    restart: always
    ports:
      - "5435:5432"
    volumes:
      - songothon_db:/var/lib/postgresql/data:rw
    environment:
      - POSTGRES_DB=songothon_db
      - POSTGRES_USER=song_user
      - POSTGRES_PASSWORD=song009
    tty: true
    networks:
      - songothon_networks

  redis:
    image: redis:7-alpine
    container_name: songothon_redis
    restart: always
    ports:
      - "6381:6379"
    command: redis-server --requirepass password123
    volumes:
      - songothon_cache:/data:rw
    networks:
      - songothon_networks

  backend:
    container_name: songothon_api
    image: ghcr.io/litonshil/songothon-be:v1.0.0
    restart: always
    ports:
      - "8084:8080"
    command: serve
    environment:
      - CONSUL_URL=http://songothon_consul:8500
      - CONSUL_PATH=songothon
    tty: true
    depends_on:
      - consul
      - db
      - redis
    networks:
      - songothon_networks
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

networks:
  songothon_networks:
    name: songothon_networks
    driver: bridge

volumes:
  songothon_db:
    name: songothon_postgres_data
  songothon_cache:
    name: songothon-cache-data
  songothon_consul:
    name: songothon-consul-data
