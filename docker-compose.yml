name: songothon

services:
  consul:
    image: consul:1.14.5
    container_name: songothon_consul
    restart: always
    command: agent -server -bootstrap-expect=1 -data-dir=/consul/data -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
    volumes:
      - songothon_consul:/consul/data:rw
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - songothon_networks

  db:
    container_name: songothon_postgres
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - songothon_db:/var/lib/postgresql/data:rw
    environment:
      - POSTGRES_DB=${DB_NAME:-songothon_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres_secure_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-songothon_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    tty: true
    networks:
      - songothon_networks

  songothon:
    container_name: songothon_api
    image: songothon
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    command: serve
    environment:
      - CONSUL_URL=http://songothon_consul:8500
      - CONSUL_PATH=songothon
    tty: true
    depends_on:
      consul:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - songothon_networks
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

networks:
  songothon_networks:
    name: songothon_networks
    driver: bridge

volumes:
  songothon_db:
    name: songothon_postgres_data
  songothon_consul:
    name: songothon-consul-data
