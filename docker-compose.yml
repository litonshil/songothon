services:
  postgres:
    image: postgres:16-alpine
    container_name: songothon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${DB_NAME:-songothon_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-songothon_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - songothon_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: songothon_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      APP_ENV: "${APP_ENV:-production}"
      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secure_pass}@postgres:5432/${DB_NAME:-songothon_db}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-production-secret-songothon-jwt-token-key-2026}"
      JWT_EXPIRY_HOURS: "${JWT_EXPIRY_HOURS:-72}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - songothon_net

volumes:
  postgres_data:
    driver: local

networks:
  songothon_net:
    driver: bridge
